version: '3.8'

services:
  # 1. LocalStack Pro: AWS giả lập với đầy đủ tính năng EC2, EFS thực thi
  localstack:
    container_name: localstack_pro_lab
    # Sửa image sang bản Pro
    image: localstack/localstack-pro:latest
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"  # Port range cho các dịch vụ Pro (như EC2/EFS)
    environment:
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      # DÁN TOKEN CỦA BẠN VÀO ĐÂY
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      # Bật tính năng EC2 thực thi bằng Docker
      - EC2_VM_MANAGER=docker
    volumes:
      - "./localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  # 2. Terraform: Môi trường chạy code HCL
  terraform:
    container_name: terraform_iam_lab
    image: hashicorp/terraform:latest
    volumes:
      - .:/workspace           # Ánh xạ thư mục hiện tại vào container
    working_dir: /workspace
    environment:
      - AWS_ACCESS_KEY_ID=test # LocalStack chấp nhận mọi key là 'test'
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - localstack
    entrypoint: /bin/sh        # Giữ container chạy để chúng ta vào gõ lệnh
    stdin_open: true
    tty: true

  # 3. Rover: Công cụ trực quan hóa kiến trúc Terraform
  rover:
    container_name: rover_visualizer
    image: im2nguyen/rover:latest
    ports:
      - "9000:9000"            # Cổng để bạn xem giao diện trên trình duyệt
    volumes:
      - .:/src                 # Ánh xạ cùng thư mục code Terraform để Rover đọc
    environment:
      # Rover cũng cần môi trường AWS giả lập để đọc plan nếu cần
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - terraform